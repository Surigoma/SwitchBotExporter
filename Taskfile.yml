version: '3'

vars:
  APP: ./cmd/switchbot-exporter
  VERSION: dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  BUILD_DATE: '{{dateInZone "2006-01-02T15:04:05Z" now "UTC"}}'
  LDFLAGS: '-X main.version={{.VERSION}} -X main.gitCommit={{.COMMIT}} -X main.buildDate={{.BUILD_DATE}}'

tasks:
  build:
    desc: Build SwitchBot Exporter for the current platform
    cmds:
      - go build -trimpath -ldflags '{{.LDFLAGS}}' -o 'dist/switchbot-exporter{{if eq OS "windows"}}.exe{{end}}' {{.APP}}

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  lint:
    desc: Check formatting and run go vet
    cmds:
      - test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - go vet ./...

  build-linux:
    desc: Cross-compile for Linux (ARCH=amd64, arm64, arm, etc.)
    requires:
      vars: [ARCH]
    vars:
      ARM_VERSION: '{{.ARM_VERSION | default "7"}}'
      TARGET: '{{if eq .ARCH "arm"}}armv{{.ARM_VERSION}}{{else}}{{.ARCH}}{{end}}'
    env:
      GOOS: linux
      GOARCH: '{{.ARCH}}'
      GOARM: '{{if eq .ARCH "arm"}}{{.ARM_VERSION}}{{end}}'
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -ldflags '{{.LDFLAGS}}' -o 'dist/switchbot-exporter-linux-{{.TARGET}}' {{.APP}}

  build-armv6:
    desc: Build the standalone Raspberry Pi Zero W binary
    cmds:
      - task: build-linux
        vars: {ARCH: arm, ARM_VERSION: '6'}
