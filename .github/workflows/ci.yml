name: CI

on:
  # Protect main requires an up-to-date "Test and build" check on the PR.
  # Do not also run on push: every PR SHA previously ran this workflow twice
  # (push + pull_request), and merge ran it a third time on main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.45.4

      - name: Test and lint
        run: |
          task lint
          go test -race ./...
          task build

      - name: Test with a mock BlueZ service
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends dbus-daemon python3-dbus python3-gi
          go build -o dist/switchbot-ble-poc ./cmd/switchbot-ble-poc
          dbus-run-session -- /usr/bin/python3 internal/ble/testdata/bluez_mock.py dist/switchbot-ble-poc

      - name: Build and verify Linux binaries
        run: bash scripts/build-linux.sh

      - name: Upload Linux binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: switchbot-exporter-linux
          path: dist/switchbot-exporter-linux-*
          if-no-files-found: error
          retention-days: 14
